name: Build Jarvis APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check voice commands
        run: |
          javac -encoding UTF-8 -d /tmp/jarvis-tests app/src/main/java/com/jarvis/assistant/VoiceCommands.java tools/VoiceRegression.java
          java -cp /tmp/jarvis-tests VoiceRegression
      - name: Build and test debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Voice-Fix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
